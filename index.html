<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idaea</title>
<meta name="description" content="Consideration is the quietest form of care.">
<style>
  :root {
    color-scheme: light;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #faf6ee;
    color: #2b2620;
    font-family: Georgia, "Times New Roman", serif;
    padding: 2rem;
    box-sizing: border-box;
  }
  main {
    max-width: 34rem;
    text-align: center;
  }
  h1 {
    font-size: 1rem;
    font-weight: normal;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    margin: 0 0 2.5rem;
    color: #6b6257;
  }
  p {
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    line-height: 1.35;
    margin: 0;
  }
  .rule {
    width: 2.5rem;
    height: 1px;
    background: #b8ad9c;
    margin: 2.5rem auto 0;
  }
  .note {
    margin-top: 1.5rem;
    font-size: 0.95rem;
    font-style: italic;
    color: #6b6257;
  }
  nav {
    margin-top: 2.5rem;
    font-size: 0.95rem;
  }
  nav a {
    color: #6b6257;
    text-decoration: none;
    border-bottom: 1px solid #b8ad9c;
  }
</style>
</head>
<body>
<main>
  <h1>Idaea</h1>
  <p>Consideration is the quietest form of care.</p>
  <div class="rule" aria-hidden="true"></div>
  <p class="note">A lab for open-ended projects.</p>
  <nav><a href="/quotes/">Favorite quotes</a></nav>
</main>
</body>
</html>
